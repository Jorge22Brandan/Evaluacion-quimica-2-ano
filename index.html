/* ===== CONSTRUCTOR DE ÁTOMOS ===== */
const T=(n,Z,A,nm)=>({n,Z,A,p:Z,pn:A-Z,e:Z,nm});
const ATOMS={
  g0:{p:[T('Litio (Li)',3,7),T('Berilio (Be)',4,9)],e:[T('Carbono (C)',6,12),T('Nitrógeno (N)',7,14)]},
  g13:{p:[T('Litio-7',3,7,['litio7','li7']),T('Hidrógeno-3 (Tritio)',1,3,['tritio','hidrogeno3','h3'])],
       e:[T('Carbono-14',6,14,['carbono14','c14']),T('Hidrógeno-2 (Deuterio)',1,2,['deuterio','hidrogeno2','h2'])]}
};
function startAtom(id,pr){
  if(!pr&&G&&G.sc[id]!==undefined){alert("Ya realizaste esta actividad evaluada.");return}
  isPractice=pr;activeExam=!pr;GI=id;LI=id==='g0'?1:2;
  AT={s:ATOMS[id][pr?'p':'e'],i:0,r:[]};atomView();
}
function atomView(){
  const t=AT.s[AT.i];placed=[];part='prot';
  app.innerHTML=`
    <div class="banner-info">${isPractice?'🎮 MODO PRÁCTICA LIBRE':'⚠️ EVALUACIÓN OFICIAL - No salgas ni minimices la pantalla'}</div>
    ${isPractice?`<button class="s" onclick="lvl(${LI})">← Volver</button>`:''}
    <h1>${GN[GI]} · Átomo ${AT.i+1} de ${AT.s.length}</h1>
    <p>${t.nm?`Hay un átomo neutro con <b>Z = ${t.Z}</b> y <b>A = ${t.A}</b>. Buscá el elemento en la tabla periódica, escribí cómo se nombra el isótopo y construí su modelo.`:`Construí un átomo neutro de <b>${t.n}</b> (Z = ${t.Z}, A = ${t.A}).`}</p>
    ${t.nm?`<input id="nmI" autocomplete="off" placeholder="Nombre del isótopo (ej.: Oxígeno-17)">`:''}
    <p class="mu">Elegí una partícula y tocá el lienzo: protones y neutrones en el <b>núcleo</b> (centro), electrones en la <b>corteza</b> (fuera del círculo central).</p>
    <div class="palette">
      <button class="part-btn p-prot active" id="btn-p" onclick="selectPart('prot')">🔴 Protón (+)</button>
      <button class="part-btn p-neut" id="btn-n" onclick="selectPart('neut')">⚪ Neutrón (0)</button>
      <button class="part-btn p-elec" id="btn-e" onclick="selectPart('elec')">🔵 Electrón (-)</button>
    </div>
    <p class="mu" id="cnt" style="text-align:center"></p>
    <div class="atom-canvas-container"><canvas id="atomCanvas" width="340" height="340"></canvas></div>
    <div class="c"><button class="s" onclick="placed.pop();drawAtom()">↩ Deshacer</button><button class="s" onclick="placed=[];drawAtom()">🗑️ Borrar todo</button><button onclick="validateAtom()">✔ Validar</button></div>`;
  const cv=$('#atomCanvas');
  cv.addEventListener('pointerdown',ev=>{const r=cv.getBoundingClientRect(),s=cv.width/r.width;placed.push({x:(ev.clientX-r.left)*s,y:(ev.clientY-r.top)*s,t:part});drawAtom()});
  drawAtom();
}
function selectPart(t){part=t;document.querySelectorAll('.part-btn').forEach(b=>b.classList.remove('active'));$('#btn-'+t.charAt(0)).classList.add('active')}
function drawAtom(){
  const cv=$('#atomCanvas');if(!cv)return;
  const ctx=cv.getContext('2d'),cx=170,cy=170;
  ctx.clearRect(0,0,340,340);
  ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.arc(cx,cy,70,0,7);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,120,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(239,68,68,.15)';ctx.strokeStyle='#ef4444';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,45,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#94a3b8';ctx.font='12px sans-serif';ctx.fillText('NÚCLEO',cx-22,cy+60);ctx.fillText('CORTEZA',cx-26,cy-128);
  let c={prot:0,neut:0,elec:0};
  placed.forEach(p=>{
    c[p.t]++;ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.font='10px sans-serif';
    if(p.t==='prot'){ctx.fillStyle='#ef4444';ctx.fill();ctx.fillStyle='#fff';ctx.fillText('+',p.x-3,p.y+3)}
    else if(p.t==='neut'){ctx.fillStyle='#94a3b8';ctx.fill();ctx.fillStyle='#000';ctx.fillText('n',p.x-3,p.y+3)}
    else{ctx.fillStyle='#3b82f6';ctx.fill();ctx.fillStyle='#fff';ctx.fillText('-',p.x-2,p.y+3)}
  });
  const n=$('#cnt');if(n)n.textContent=`Colocados → Protones: ${c.prot} · Neutrones: ${c.neut} · Electrones: ${c.elec}`;
}
function validateAtom(){
  const t=AT.s[AT.i];let p=0,n=0,e=0,bad=false;
  placed.forEach(o=>{const d=Math.hypot(o.x-170,o.y-170);
    if(o.t==='prot'){p++;if(d>50)bad=true}else if(o.t==='neut'){n++;if(d>50)bad=true}else{e++;if(d<55)bad=true}});
  const okc=p===t.p&&n===t.pn&&e===t.e;
  let b=okc&&!bad?10:okc?6:2,nameOk=null;
  if(t.nm){nameOk=t.nm.includes(nz($('#nmI').value));b=(nameOk?5:0)+b/2}
  AT.r.push({t,p,n,e,bad,b,nameOk});
  const last=AT.i===AT.s.length-1;
  if(last)activeExam=false;
  const R=AT.r[AT.r.length-1];
  let fin='';
  if(last){
    const avg=Math.round(mean(AT.r.map(x=>x.b))*10)/10;
    if(!isPractice&&G){G.sc[GI]=avg;sv()}
    fin=`<h2>Nota de la actividad: <span class="${avg>=6?'g':'r'}">${f1(avg)} / 10</span></h2>`;
  }
  app.innerHTML=`<div class="c">
    <h2>Átomo ${AT.i+1}: ${t.n}</h2>
    <div class="n ${R.b>=6?'g':'r'}">${f1(R.b)} / 10</div>
    <ul>
      <li>Protones: ${p} / ${t.p} ${p===t.p?'✔':'✖'}</li><li>Neutrones: ${n} / ${t.pn} ${n===t.pn?'✔':'✖'}</li><li>Electrones: ${e} / ${t.e} ${e===t.e?'✔':'✖'}</li>
      ${t.nm?`<li>Nombre del isótopo (${t.n}): ${nameOk?'✔':'✖'}</li>`:''}
    </ul>
    ${bad?'<p class="r">⚠️ Protones y neutrones van DENTRO del núcleo; los electrones FUERA, en la corteza.</p>':''}
    ${fin}
    ${last?`${isPractice?`<button onclick="startAtom('${GI}',true)">Practicar de nuevo</button><button class="s" onclick="lvl(${LI})">Volver al Nivel</button>`:`<button onclick="lvl(${LI})">Volver al Nivel</button>`}`
          :`<button onclick="AT.i++;atomView()">Siguiente átomo →</button>`}
  </div>`;
}

/* ===== PREGUNTAS ===== */
async function startExam(id){
  await checkCloudRoom();
  if(!roomActiveCloud){alert("La sala está cerrada.");return}
  if(blocked())return;
  if(G.sc[id]!==undefined){alert("Ya realizaste esta actividad evaluada.");return}
  isPractice=false;activeExam=true;GI=id;
  Q=EVAL_QUESTIONS[id]||GEN_PRACTICE[id]();k=0;sc=0;show();
}
function startPractice(id){
  isPractice=true;activeExam=false;GI=id;
  Q=GEN_PRACTICE[id]?GEN_PRACTICE[id]():EVAL_QUESTIONS[id];k=0;sc=0;show();
}
function playPracticeLvl(i){LI=i;go(LV[i].g[0],true)}

function show(){
  const q=Q[k];
  app.innerHTML=`
    <div class="banner-info">${isPractice?'🎮 MODO PRÁCTICA LIBRE':'⚠️ EVALUACIÓN OFICIAL EN CURSO - No salgas ni minimices la pantalla'}</div>
    <p class="mu">${GN[GI]} · Pregunta ${k+1} de ${Q.length} ${isPractice?'':'· Puntos: '+f1(sc*10/Q.length)}</p>
    <div class="c">
      <h2>${q.q}</h2>
      ${isPractice&&q.h?`<p class="mu">💡 Pista: ${q.h}</p>`:''}
      ${q.w?`<input id="wi" autocomplete="off" placeholder="Tu respuesta"><button id="wb" onclick="aw()">Responder</button>`:q.o.map((x,j)=>`<button class="o" onclick="ans(${j})">${x}</button>`).join('')}
      <div id="fb"></div>
    </div>`;
}
function ans(j){
  const q=Q[k];
  document.querySelectorAll('.o').forEach((x,i)=>{x.disabled=true;if(q.o[i]===q.a)x.classList.add('ok');else if(i==j)x.classList.add('ko')});
  fin(q.o[j]===q.a);
}
function aw(){
  const q=Q[k],v=nz($('#wi').value);
  $('#wi').disabled=true;$('#wb').disabled=true;
  fin(q.w.map(nz).includes(v));
}
function fin(g){
  if(g)sc++;
  $('#fb').innerHTML=`<p class="${g?'g':'r'}">${g?'✔ ¡Correcto!':'✖ La respuesta correcta era: '+Q[k].a}</p><button onclick="nx()">${k<Q.length-1?'Siguiente':'Ver resultado'}</button>`;
}
function nx(){
  k++;if(k<Q.length)return show();
  activeExam=false;
  const n=Math.round(sc*100/Q.length)/10;
  if(!isPractice&&G){G.sc[GI]=n;sv()}
  const a=lavg(LI);
  app.innerHTML=`<div class="c">
    <h2>${GN[GI]} (${isPractice?'Práctica':'Evaluación'})</h2>
    <div class="n ${n>=6?'g':'r'}">${f1(n)} / 10</div>
    <p>Respuestas correctas: ${sc} de ${Q.length}.</p>
    ${isPractice?`<button onclick="startPractice('${GI}')">Practicar de nuevo</button><button class="s" onclick="lvl(${LI})">Volver al Nivel</button>`
    :`${a!==null?`<p>Promedio acumulado del nivel: <b>${f1(a)}</b></p>`:''}<button class="s" onclick="lvl(${LI})">Volver al Nivel</button><button class="s" onclick="home()">Ir al Inicio</button>`}
  </div>`;
}

/* ===== ACRÓSTICO ===== */
function acro(pr){
  isPractice=pr;
  if(!pr&&G&&G.sc['g11']!==undefined){alert("Ya realizaste esta actividad evaluada.");return}
  if(!pr)activeExam=true;
  GI='g11';LI=6;ACL=pr?ACP:AC;
  app.innerHTML=`
    <div class="banner-info">${pr?'🎮 MODO PRÁCTICA':'⚠️ EVALUACIÓN EN CURSO - No salgas ni minimices la pantalla'}</div>
    ${pr?`<button class="s" onclick="lvl(6)">← Volver</button>`:''}
    <h1>Acróstico</h1><p>Leé cada pista y escribí la palabra que corresponde.</p>
    ${ACL.map((a,i)=>`<div class="c"><b>${i+1}.</b> ${a[2]}<input id="ac${i}" autocomplete="off" placeholder="Escribí la palabra"><div id="ar${i}"></div></div>`).join('')}
    <button id="ab" onclick="acheck()">Comprobar</button><div id="ao"></div>`;
}
function acheck(){
  let c=0;
  ACL.forEach((a,i)=>{
    const g=nz($('#ac'+i).value)==nz(a[1]);if(g)c++;
    $('#ac'+i).disabled=true;
    $('#ar'+i).innerHTML=g?'<span class="g">✔ Correcto</span>':'<span class="r">✖ Era: '+a[1]+'</span>';
  });
  $('#ab').disabled=true;activeExam=false;
  const v=Math.round((c/7)*100)/10;
  if(!isPractice&&G){G.sc['g11']=v;sv()}
  $('#ao').innerHTML=`<p>Acertaste ${c} de 7. Nota: ${f1(v)}</p><button onclick="${isPractice?'lvl(6)':'home()'}">Continuar</button>`;
}

function modoEstudioLibre(){
  G=null;isPractice=true;activeExam=false;
  app.innerHTML=`
    <div class="nav-docente"><h1>📖 Repaso y Práctica Libre</h1><button class="s" onclick="reg()">Volver</button></div>
    ${LV.map((L,i)=>`<div class="c"><h2>${L.t}</h2><button onclick="lvl(${i})">📖 Ver Teoría y Ejercitar</button></div>`).join('')}`;
}

/* ===== PANEL DOCENTE ===== */
function loginDocente(){
  const p=prompt("Ingrese la clave del docente:");
  if(p==="docente123")panelDocente();else if(p!==null)alert("Clave incorrecta.");
}
async function panelDocente(){
  ld();await checkCloudRoom();
  const ks=Object.keys(DB);
  app.innerHTML=`
    <div class="nav-docente"><h1>👨‍🏫 Panel del Docente</h1><button class="s" onclick="reg()">Cerrar Panel</button></div>
    <div class="c"><h2>Control de la Sala (Nube)</h2>
      <p><b>Estado actual:</b> ${roomActiveCloud?'🟢 ABIERTA':'🔴 CERRADA'}</p>
      <button onclick="setCloudRoom(true)">Habilitar Sala</button><button class="danger" onclick="setCloudRoom(false)">Cerrar Sala</button></div>
    <div class="c"><h2>🔓 Rehabilitar Estudiante Bloqueado</h2>
      <p class="mu">Ingresá su Curso y el nombre del Integrante 1 para reiniciar sus avisos:</p>
      <input id="reh_cu" placeholder="Curso y división (ej.: 2.º 1.ª)"><input id="reh_nom" placeholder="Nombre del Integrante 1">
      <button onclick="rehabilitarPorNombre()">Rehabilitar Estudiante</button></div>
    <div class="c"><h2>Monitoreo Local</h2>
      <table><thead><tr><th>Estudiantes</th><th>Nota Final (÷ ${LV.length})</th><th>Avisos / Estado</th></tr></thead><tbody>
      ${ks.length===0?'<tr><td colspan="3">Sin registros en este dispositivo. Las notas generales podés verlas en tu Google Sheet.</td></tr>':''}
      ${ks.map(x=>{const g=DB[x];return `<tr><td><b>${g.m.join(', ')}</b><br><small>${g.cu||''}</small></td><td><b>${f1(calcTotalScoreStrict(g))}</b></td><td>${g.status||'En línea'}<br><small>Avisos: ${g.attempts||0}/3</small></td></tr>`}).join('')}
      </tbody></table></div>`;
}
function rehabilitarPorNombre(){
  const cu=$('#reh_cu').value.trim(),nom=$('#reh_nom').value.trim();
  if(!cu||!nom){alert("Completá el curso y el nombre del integrante.");return}
  const key=`${cu} - ${nom}`;
  if(DB[key]){DB[key].attempts=0;DB[key].status='Habilitado por el docente';sv()}
  else{
    fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"rehab",cu,m:[nom],sc:{},finalScore:0,status:"Habilitado por el docente",attempts:0})});
  }
  alert(`Solicitud de rehabilitación enviada para ${key}.`);
  panelDocente();
}
async function setCloudRoom(active){
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"setRoom",active})});
    alert(active?"🟢 Sala abierta exitosamente para todos los alumnos.":"🔴 Sala cerrada.");
    panelDocente();
  }catch(e){alert("Error al cambiar el estado de la sala.")}
}

reg();
</script></body></html>
