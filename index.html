<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de la Tabla Periódica · 2.º año</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1b2430;--mu:#5d6b7c;--ac:#2563eb;--ok:#166534;--ko:#991b1b;--bd:#d6dde8;--okb:#dcfce7;--kob:#fee2e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--cd:#18202e;--tx:#e8edf5;--mu:#9aa8bb;--ac:#6ea0ff;--ok:#86efac;--ko:#fca5a5;--bd:#2c384b;--okb:#12341f;--kob:#3b1717;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--cd:#18202e;--tx:#e8edf5;--mu:#9aa8bb;--ac:#6ea0ff;--ok:#86efac;--ko:#fca5a5;--bd:#2c384b;--okb:#12341f;--kob:#3b1717;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.15rem;margin:.6em 0}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:.9rem}
input,select{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:10px 14px;margin:4px 4px 4px 0}
button.s{background:transparent;color:var(--ac)}button.danger{background:var(--ko);border-color:var(--ko);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.o{display:block;width:100%;text-align:left;background:var(--cd);color:var(--tx);border-color:var(--bd);margin:8px 0}
.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.o.ko{background:var(--kob);border-color:var(--ko);color:var(--ko)}
.th{max-height:50vh;overflow-y:auto;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.highlightable{cursor:pointer;padding:4px 6px;border-radius:4px;transition:background .2s;margin-bottom:6px}
.highlightable:hover{background:rgba(37,99,235,0.1)}
.highlightable.subrayado{background:#fef08a;border-left:4px solid #eab308;color:#713f12}
@media(prefers-color-scheme:dark){.highlightable.subrayado{background:#422006;color:#fde047}}
.n{font-size:1.8rem;font-weight:700}.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;border:1px solid var(--bd)}
.g{color:var(--ok)}.r{color:var(--ko)}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}
.banner{background:var(--kob);border:1px solid var(--ko);color:var(--ko);padding:10px;border-radius:8px;margin-bottom:12px;font-weight:bold}
.banner-info{background:var(--okb);border:1px solid var(--ok);color:var(--ok);padding:10px;border-radius:8px;margin-bottom:12px}
.nav-docente{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

/* TABLA PERIÓDICA ESTILO CLÁSICO PAPEL */
.ptable-container{overflow-x:auto;margin:12px 0;padding:8px;background:var(--cd);border-radius:8px;border:1px solid var(--bd)}
.classic-grid{display:grid;grid-template-columns:repeat(18, 38px);grid-template-rows:repeat(7, 44px);gap:3px;min-width:720px;font-size:0.7rem;text-align:center}
.pcell{border:1px solid var(--bd);border-radius:4px;padding:2px;cursor:pointer;background:var(--bg);user-select:none;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform 0.1s}
.pcell:hover{transform:scale(1.15);z-index:10;box-shadow:0 3px 8px rgba(0,0,0,0.25)}
.pcell.empty{border:none;background:transparent;cursor:default;pointer-events:none}
.pcell .num{font-size:0.55rem;color:var(--mu);line-height:1}
.pcell .sym{font-size:0.85rem;font-weight:bold;line-height:1.1}
.pcell.solid .sym{color:#2563eb}
.pcell.liquid .sym{color:#dc2626}
.pcell.gas .sym{color:#16a34a}
.pcell.highlighted{background:#fef08a!important;border-color:#ca8a04!important}
.ptable-legend{display:flex;gap:12px;font-size:0.8rem;margin-top:8px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px}

/* CONSTRUCTOR DE ÁTOMO */
.atom-canvas-container{text-align:center;position:relative}
canvas#atomCanvas{background:#0f172a;border-radius:12px;cursor:pointer;touch-action:none;max-width:100%}
.palette{display:flex;justify-content:center;gap:10px;margin:10px 0}
.part-btn{padding:8px 12px;border-radius:20px;border:2px solid transparent;font-weight:bold;cursor:pointer}
.part-btn.p-prot{background:#ef4444;color:#fff}
.part-btn.p-neut{background:#94a3b8;color:#0f172a}
.part-btn.p-elec{background:#3b82f6;color:#fff}
.part-btn.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.5)}
</style></head><body><main id="app"></main>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpH_UNYuAkgFSmkHspanZPsitBIg-bvba-FEcNK-iWyGDg4Y5drlYB2eMpdCPHXgyooA/exec";

const READ_QUESTIONS = [
  [
    {q: '¿Cuál de las siguientes opciones describe mejor a los metales?', a: 'Tienen brillo, conducen el calor y la electricidad', o: ['No brillan y son malos conductores', 'Tienen brillo, conducen el calor y la electricidad', 'Están en el grupo 18 y no reaccionan', 'Son todos gases a temperatura ambiente']},

const f1=x=>(Math.round(x*10)/10).toString().replace('.',',');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sc2=id=>G && G.sc ? G.sc[id] : undefined;

const lavg=i=>{
  if(!G) return null;
  const s=LV[i].g.map(sc2);
  return s.every(x=>x!==undefined) ? mean(s) : null;
};

const calcTotalScoreStrict = (groupObj) => {
  let sumAverages = 0;
  LV.forEach((L, i) => {
    const scores = L.g.map(gId => groupObj.sc ? groupObj.sc[gId] : undefined);
    if(scores.every(x => x !== undefined)){
      sumAverages += mean(scores);
    } else {
      sumAverages += 0;
    }
  });
  return sumAverages / 6;
};

function penalizeStudent(reason) {
  if(!G) return;
  G.attempts = (G.attempts || 0) + 1;
  activeExam = false;
  
  if(G.attempts >= 3){
    G.sc[GI] = 1;
    G.status = "Desaprobado definitivamente (3 salidas)";
    sv();
    alert(`⚠️ EVALUACIÓN BLOQUEADA DEFINITIVAMENTE (${reason})\n\nConsumiste tus 3 oportunidades de reintento. Quedas desaprobado con nota 1.`);
    home();
  } else {
    G.status = `Bloqueado temporalmente (Intento ${G.attempts}/3)`;
    sv();
    alert(`⚠️ ALERTA (${reason})\n\nSaliste o minimizaste la pantalla (Aviso ${G.attempts} de 3).\nEl docente deberá habilitarte nuevamente.`);
    home();
  }
}

        <div class="banner-info"><b>Paso 1: Subrayado activo.</b> Hacé clic en al menos <b>2 párrafos</b> para continuar. (<span id="h-count">0</span>/2)</div>
        <div class="th" id="theory-box">${L.th}</div>
        <br>
        <button id="btn-quiz" disabled onclick="startReadingQuiz(${i})">Someterse a Control de Lectura (${totalQ} ${totalQ===1?'pregunta':'preguntas'}) →</button>
      `}
    </div>

    ${G && alreadyRead ? `
      <div class="c">
        <h2>Evaluación Oficial</h2>
        ${!roomActiveCloud ? `<p class="r">🔒 Sala cerrada por el docente.</p>` : ''}
        ${L.g.map(x=>{
          const done = G.sc[x]!==undefined;
          return `
            <button ${!roomActiveCloud || done ? 'disabled':''} onclick="${x=='g0'?'startAtomInteractive(false)':(x=='g11'?'acro(false)':'startExam(\''+x+'\')')}">
              ${done ? '✔ Completado' : '📝 Evaluar:'} ${GN[x]} ${done ? '('+f1(G.sc[x])+')':''}
            </button>
          `;
        }).join('')}
      </div>
    `:''}

    <div class="c">
      <h2>Práctica Libre (Sin Nota)</h2>
      ${L.g.map(x=>`<button class="s" onclick="${x=='g0'?'startAtomInteractive(true)':(x=='g11'?'acro(true)':'startPractice(\''+x+'\')')}">🎮 Practicar: ${GN[x]}</button>`).join('')}
    </div>
  `;

  if(i === 0) renderClassicPTable();
}

function renderClassicPTable(){
  const container = $('#interactivePTable');
  if(!container) return;
  container.innerHTML = '';
  
  const gridMap = {};
  E.forEach(e => {
    gridMap[`${e.p}-${e.g}`] = e;
  });

  for(let p=1; p<=7; p++){
    for(let g=1; g<=18; g++){
      const e = gridMap[`${p}-${g}`];
      const div = document.createElement('div');
      if(e){
        const stateClass = e.e === 'Sólido' ? 'solid' : (e.e === 'Líquido' ? 'liquid' : 'gas');
        div.className = `pcell ${stateClass}`;
        div.id = `elem-${e.s}`;
        div.innerHTML = `<span class="num">${e.Z}</span><span class="sym">${e.s}</span>`;
        div.onclick = () => showElementDetail(e);
      } else {
        div.className = 'pcell empty';
      }
      container.appendChild(div);
    }
  }
}

function showElementDetail(e){
  const d = $('#elementDetail');
  if(!d) return;
  d.style.display = 'block';
  d.innerHTML = `<b>${e.n} (${e.s})</b> — Z: ${e.Z} | A: ${e.A} | Grupo: ${e.g} | Período: ${e.p} | Clasificación: ${e.t} | Estado: <b>${e.e}</b>`;
}

function highlightGroup(gNum){
  clearHighlights();
  E.filter(e => e.g === gNum).forEach(e => {
    const el = $('#elem-' + e.s);
    if(el) el.classList.add('highlighted');
  });
}

function highlightPeriod(pNum){
  clearHighlights();
  E.filter(e => e.p === pNum).forEach(e => {
    const el = $('#elem-' + e.s);
    if(el) el.classList.add('highlighted');
  });
}

function clearHighlights(){
  document.querySelectorAll('.pcell').forEach(c => c.classList.remove('highlighted'));
}

function toggleSub(el){
  if(!el.classList.contains('subrayado')){ el.classList.add('subrayado'); highlightedCount++; }
  else { el.classList.remove('subrayado'); highlightedCount--; }
  const counter = $('#h-count'); if(counter) counter.textContent = highlightedCount;
  const btn = $('#btn-quiz'); if(btn) btn.disabled = highlightedCount < 2;
}

function startReadingQuiz(levelIndex){
  const qs = READ_QUESTIONS[levelIndex] || READ_QUESTIONS[0];
  const q = qs[readingQuizStep];
  app.innerHTML=`
    <button class="s" onclick="lvl(${levelIndex})">← Cancelar</button>
    <h1>Control de Lectura · Pregunta ${readingQuizStep + 1} de ${qs.length}</h1>
    <div class="c">
      <h2>${q.q}</h2>
      ${q.o.map((opt, j)=>`<button class="o" onclick="ansReadingQuiz(${j}, '${q.a}', ${levelIndex})">${opt}</button>`).join('')}
      <div id="rq-fb"></div>
    </div>
  `;
}

function ansReadingQuiz(selectedIdx, correctAns, levelIndex){
  const qs = READ_QUESTIONS[levelIndex] || READ_QUESTIONS[0];
  const q = qs[readingQuizStep];
  const isCorrect = (q.o[selectedIdx] === correctAns);
  if(isCorrect) readingQuizScore++;
  const buttons = document.querySelectorAll('.o');
  buttons.forEach((btn, idx)=>{
    btn.disabled = true;
    if(q.o[idx] === correctAns) btn.classList.add('ok');
    else if(idx === selectedIdx) btn.classList.add('ko');
  });
  $('#rq-fb').innerHTML=`
    <p class="${isCorrect?'g':'r'}">${isCorrect?'✔ ¡Correcto!':'✖ Incorrecto. La respuesta era: '+correctAns}</p>
    <button onclick="nextReadingQuizStep(${levelIndex})">Continuar</button>
  `;
}

function nextReadingQuizStep(levelIndex){
  const qs = READ_QUESTIONS[levelIndex] || READ_QUESTIONS[0];
  readingQuizStep++;
  if(readingQuizStep < qs.length){
    startReadingQuiz(levelIndex);
  } else {
    if(readingQuizScore >= Math.ceil(qs.length/2) || qs.length === 1){
      if(G){ G.read[levelIndex] = true; sv(); }
      app.innerHTML=`<div class="c"><h2>🎉 ¡Control de lectura aprobado!</h2><p class="g">Respondiste correctamente ${readingQuizScore} de ${qs.length} preguntas.</p><button onclick="lvl(${levelIndex})">Ir a las Actividades</button></div>`;
    } else {
      app.innerHTML=`<div class="c"><h2>⚠️ No alcanzaste el mínimo</h2><p class="r">Aprobaste ${readingQuizScore} de ${qs.length}. Debes repasar la teoría.</p><button onclick="lvl(${levelIndex})">Reintentar</button></div>`;
    }
  }
}

function startAtomInteractive(practiceMode=false){
  isPractice = practiceMode;
  if(!isPractice && roomActiveCloud && G && G.sc['g0']!==undefined){
    alert("Ya realizaste el dibujo evaluado del átomo."); return;
  }
  if(!isPractice) activeExam = true;
  GI = 'g0'; LI = 1; placedParticles = []; activeParticle = 'prot';

  const target = isPractice ? { name: 'Litio (Li)', Z: 3, A: 7, p: 3, n: 4, e: 3 } : { name: 'Carbono (C)', Z: 6, A: 12, p: 6, n: 6, e: 6 };
  window.CURRENT_ATOM_TARGET = target;

  app.innerHTML=`
    <div class="banner-info">${isPractice ? '🎮 MODO PRÁCTICA LIBRE (Litio)' : '⚠️ EVALUACIÓN OFICIAL - Construcción del Átomo (Carbono)'}</div>
    <button class="s" onclick="lvl(1)">← Volver</button>
    <h1>Dibujo de la Estructura Atómica</h1>
    <p>Construí un átomo neutro de <b>${target.name} (Z = ${target.Z}, A = ${target.A})</b>.</p>
    <p class="mu">Seleccioná una partícula y hacé clic en el lienzo para colocarla en la zona correspondiente (Núcleo o Corteza).</p>

    <div class="palette">
      <button class="part-btn p-prot active" id="btn-p" onclick="selectPart('prot')">🔴 Protón (+)</button>
      <button class="part-btn p-neut" id="btn-n" onclick="selectPart('neut')">⚪ Neutrón (0)</button>
      <button class="part-btn p-elec" id="btn-e" onclick="selectPart('elec')">🔵 Electrón (-)</button>
    </div>

    <div class="atom-canvas-container">
      <canvas id="atomCanvas" width="340" height="340"></canvas>
    </div>

    <div class="c">
      <button onclick="clearAtomCanvas()">🗑️ Borrar Todo</button>
      <button onclick="validateAtomBuild()">✔ Validar Átomo</button>
    </div>
  `;

  setTimeout(initAtomCanvas, 50);
}

function selectPart(type){
  activeParticle = type;
  document.querySelectorAll('.part-btn').forEach(b=>b.classList.remove('active'));
  $('#btn-'+type.charAt(0)).classList.add('active');
}

function initAtomCanvas(){
  const cv = $('#atomCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');

  const draw = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const cx = cv.width/2, cy = cv.height/2;

    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(cx, cy, 70, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
    ctx.fillText('NÚCLEO', cx - 22, cy + 4);
    ctx.fillText('CORTEZA', cx - 26, cy - 80);

    placedParticles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9, 0, Math.PI*2);
      if(p.type === 'prot') { ctx.fillStyle = '#ef4444'; ctx.fill(); ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.fillText('+', p.x-3, p.y+3); }
      else if(p.type === 'neut') { ctx.fillStyle = '#94a3b8'; ctx.fill(); ctx.fillStyle='#000'; ctx.font='10px sans-serif'; ctx.fillText('n', p.x-3, p.y+3); }
      else if(p.type === 'elec') { ctx.fillStyle = '#3b82f6'; ctx.fill(); ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.fillText('-', p.x-2, p.y+3); }
    });
  };

  cv.addEventListener('pointerdown', (e) => {
    const rect = cv.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    placedParticles.push({ x, y, type: activeParticle });
    draw();
  });

  draw();
}

function clearAtomCanvas(){
  placedParticles = [];
  initAtomCanvas();
}

function validateAtomBuild(){
  const target = window.CURRENT_ATOM_TARGET || { name: 'Litio (Li)', Z: 3, A: 7, p: 3, n: 4, e: 3 };
  const cx = 170, cy = 170;
  let pCount = 0, nCount = 0, eCount = 0;
  let coreErrors = false, crustErrors = false;

  placedParticles.forEach(p => {
    const dist = Math.hypot(p.x - cx, p.y - cy);
    if(p.type === 'prot'){
      pCount++;
      if(dist > 45) coreErrors = true;
    } else if(p.type === 'neut'){
      nCount++;
      if(dist > 45) coreErrors = true;
    } else if(p.type === 'elec'){
      eCount++;
      if(dist < 50) crustErrors = true;
    }
  });

  const correctCounts = (pCount === target.p && nCount === target.n && eCount === target.e);
  const perfectlyBuilt = correctCounts && !coreErrors && !crustErrors;

  activeExam = false;
  const scoreVal = perfectlyBuilt ? 10 : (correctCounts ? 6 : 2);

  if(!isPractice && G){
    G.sc['g0'] = scoreVal;
    sv();
  }

  app.innerHTML = `
    <div class="c">
      <h2>Resultado del Dibujo Atómico (${target.name})</h2>
      <div class="n ${scoreVal>=6?'g':'r'}">${scoreVal} / 10</div>
      <p><b>Resumen de tu construcción:</b></p>
      <ul>
        <li>Protones en núcleo: ${pCount} / ${target.p} ${pCount===target.p?'✔':'✖'}</li>
        <li>Neutrones en núcleo: ${nCount} / ${target.n} ${nCount===target.n?'✔':'✖'}</li>
        <li>Electrones en corteza: ${eCount} / ${target.e} ${eCount===target.e?'✔':'✖'}</li>
      </ul>
      ${coreErrors ? '<p class="r">⚠️ Los protones y neutrones deben colocarse DENTRO del núcleo.</p>' : ''}
      ${crustErrors ? '<p class="r">⚠️ Los electrones deben colocarse FUERA del núcleo (en la corteza).</p>' : ''}
      <button onclick="${isPractice ? 'startAtomInteractive(true)' : 'lvl(1)'}">Continuar</button>
    </div>
  `;
}

async function startExam(id){
  await checkCloudRoom();
  if(!roomActiveCloud){ alert("La sala está cerrada."); return; }
  if(G.sc[id] !== undefined){ alert("Ya realizaste esta actividad evaluada."); return; }
  isPractice = false; activeExam = true; GI = id;
  Q = EVAL_QUESTIONS[id] || GEN_PRACTICE[id]();
  k = 0; sc = 0;
  show();
}

function startPractice(id){
  isPractice = true; activeExam = false; GI = id;
  Q = GEN_PRACTICE[id] ? GEN_PRACTICE[id]() : EVAL_QUESTIONS[id];
  k = 0; sc = 0;
  show();
}

function playPracticeLvl(i){ LI=i; startPractice(LV[i].g[0]); }

function show(){
  const q=Q[k];
  app.innerHTML=`
    <div class="banner-info">
      ${isPractice ? '🎮 MODO PRÁCTICA LIBRE' : '⚠️ EVALUACIÓN OFICIAL EN CURSO - No salgas ni minimices la pantalla'}
    </div>
    <p class="mu">${GN[GI]} · Pregunta ${k+1} de ${Q.length} ${isPractice ? '' : '· Puntos: '+f1(sc*10/Q.length)}</p>
    <div class="c">
      <h2>${q.q}</h2>
      ${q.w?`<input id="wi" autocomplete="off" placeholder="Tu respuesta"><button id="wb" onclick="aw()">Responder</button>`:q.o.map((x,j)=>`<button class="o" onclick="ans(${j})">${x}</button>`).join('')}
      <div id="fb"></div>
    </div>
  `;
}

function ans(j){
  const q=Q[k], b=document.querySelectorAll('.o');
  b.forEach((x,i)=>{
    x.disabled=true;
    if(q.o[i]===q.a) x.classList.add('ok');
    else if(i==j) x.classList.add('ko');
  });
  fin(q.o[j]===q.a);
}

function aw(){
  const q=Q[k], v=nz($('#wi').value);
  $('#wi').disabled=true; $('#wb').disabled=true;
  fin(q.w.includes(v));
}

function fin(g){
  if(g) sc++;
  $('#fb').innerHTML=`
    <p class="${g?'g':'r'}">${g?'✔ ¡Correcto!':'✖ La respuesta correcta era: '+Q[k].a}</p>
    <button onclick="nx()">${k<Q.length-1?'Siguiente':'Ver resultado'}</button>
  `;
}

function nx(){
  k++;
  if(k<Q.length) return show();
  activeExam = false;
  const n = Math.round(sc*100/Q.length)/10;

  if(!isPractice && G){
    G.sc[GI] = n;
    sv();
  }

  const a = lavg(LI);
  app.innerHTML=`
    <div class="c">
      <h2>${GN[GI]} (${isPractice ? 'Práctica' : 'Evaluación'})</h2>
      <div class="n ${n>=6?'g':'r'}">${n} / 10</div>
      <p>Respuestas correctas: ${sc} de ${Q.length}.</p>
      ${isPractice ? `
        <button onclick="startPractice('${GI}')">Practicar de nuevo</button>
        <button class="s" onclick="lvl(${LI})">Volver al Nivel</button>
      ` : `
        ${a!==null ? `<p>Promedio acumulado del nivel: <b>${f1(a)}</b></p>` : ''}
        <button class="s" onclick="lvl(${LI})">Volver al Nivel</button>
        <button class="s" onclick="home()">Ir al Inicio</button>
      `}
    </div>
  `;
}

function acro(practiceMode=false){
  isPractice = practiceMode;
  if(!isPractice && roomActiveCloud && G && G.sc['g11']!==undefined){
    alert("Ya realizaste esta actividad evaluada."); return;
  }
  if(!isPractice) activeExam = true;
  GI='g11'; LI=5;

  app.innerHTML=`
    <div class="banner-info">${isPractice ? '🎮 MODO PRÁCTICA' : '⚠️ EVALUACIÓN EN CURSO'}</div>
    <button class="s" onclick="lvl(5)">← Volver</button>
    <h1>Acróstico</h1>
    <p>Completá cada palabra empezando con la letra indicada.</p>
    ${AC.map((a,i)=>`
      <div class="c">
        <b>${a[0]}</b> · ${a[2]}
        <input id="ac${i}" autocomplete="off" placeholder="Empieza con ${a[0]}">
        <div id="ar${i}"></div>
      </div>
    `).join('')}
    <button id="ab" onclick="acheck()">Comprobar</button>
    <div id="ao"></div>
  `;
}

function acheck(){
  let c=0;
  AC.forEach((a,i)=>{
    const g=nz($('#ac'+i).value)==nz(a[1]);
    if(g) c++;
    $('#ac'+i).disabled=true;
    $('#ar'+i).innerHTML=g?'<span class="g">✔ Correcto</span>':'<span class="r">✖ Era: '+a[1]+'</span>';
  });
  $('#ab').disabled=true;
  activeExam = false;
  const scoreVal = Math.round((c/7)*100)/10;
  if(!isPractice && G){
    G.sc['g11'] = scoreVal;
    sv();
  }
  $('#ao').innerHTML=`<p>Acertaste ${c} de 7. Nota: ${scoreVal}</p><button onclick="${isPractice ? 'lvl(5)' : 'home()'}">Continuar</button>`;
}

function modoEstudioLibre(){
  G=null; isPractice=true; activeExam=false;
  app.innerHTML=`
    <div class="nav-docente">
      <h1>📖 Repaso y Práctica Libre</h1>
      <button class="s" onclick="reg()">Volver</button>
    </div>
    ${LV.map((L,i)=>`<div class="c"><h2>${L.t}</h2><button onclick="lvl(${i})">📖 Ver Teoría y Ejercitar</button></div>`).join('')}
  `;
}

function loginDocente(){
  const p = prompt("Ingrese la clave del docente:");
  if(p === "docente123") panelDocente();
  else if(p !== null) alert("Clave incorrecta.");
}

async function panelDocente(){
  ld();
  await checkCloudRoom();
  const ks=Object.keys(DB);
  app.innerHTML=`
    <div class="nav-docente">
      <h1>👨‍🏫 Panel del Docente</h1>
      <button class="s" onclick="reg()">Cerrar Panel</button>
    </div>
    <div class="c">
      <h2>Control de la Sala (Nube)</h2>
      <p><b>Estado actual:</b> ${roomActiveCloud ? '🟢 ABIERTA' : '🔴 CERRADA'}</p>
      <button onclick="setCloudRoom(true)">Habilitar Sala</button>
      <button class="danger" onclick="setCloudRoom(false)">Cerrar Sala</button>
    </div>

    <div class="c">
      <h2>🔓 Rehabilitar Estudiante Bloqueado</h2>
      <p class="mu">Si un alumno fue bloqueado en su teléfono, ingresá su Curso y Nombre para rehabilitarlo:</p>
      <input id="reh_cu" placeholder="Curso y división (ej.: 2.º 1.ª)">
      <input id="reh_nom" placeholder="Nombre del Integrante 1">
      <button onclick="rehabilitarPorNombre()">Rehabilitar Estudiante</button>
    </div>

    <div class="c">
      <h2>Monitoreo Local</h2>
      <table>
        <thead><tr><th>Estudiantes</th><th>Nota Final (÷ 6)</th><th>Salidas / Estado</th></tr></thead>
        <tbody>
          ${ks.length === 0 ? '<tr><td colspan="3">Sin registros en este dispositivo. Las notas generales podés verlas en tu Google Sheet.</td></tr>' : ''}
          ${ks.map(k => {
            const g = DB[k];
            const tot = calcTotalScoreStrict(g);
            return `
              <tr>
                <td><b>${g.m.join(', ')}</b><br><small>${g.cu||''}</small></td>
                <td><b>${f1(tot)}</b></td>
                <td>${g.status || 'En línea'}<br><small>Intentos: ${g.attempts || 0}/3</small></td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function rehabilitarPorNombre(){
  const cu = $('#reh_cu').value.trim();
  const nom = $('#reh_nom').value.trim();
  if(!cu || !nom){ alert("Completá el curso y el nombre del integrante."); return; }
  
  const key = `${cu} - ${nom}`;
  
  if(DB[key]){
    DB[key].attempts = 0;
    DB[key].status = 'Habilitado por el docente';
    sv();
  } else {
    const payload = {
      cu: cu,
      m: [nom],
      sc: {},
      finalScore: 0,
      status: "Habilitado por el docente",
      attempts: 0
    };
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  }
  
  alert(`Solicitud de rehabilitación enviada para ${key}. El alumno ya puede volver a ingresar.`);
  panelDocente();
}

async function setCloudRoom(active){
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "setRoom", active: active })
    });
    alert(active ? "🟢 Sala abierta exitosamente para todos los alumnos." : "🔴 Sala cerrada.");
    panelDocente();
  } catch(e) {
    alert("Error al cambiar el estado de la sala.");
  }
}

reg();
